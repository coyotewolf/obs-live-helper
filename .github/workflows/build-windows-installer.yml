name: Build Windows Installer
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test credential and administration guards
        run: node --test tests/security.test.cjs
      - name: Test upload and redirect dependencies
        run: node tests/dependency-security.test.cjs
      - name: Test real Electron runtime offline
        run: node tests/electron-smoke.cjs
      - name: Build installer
        run: npm run dist -- --publish never
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Live-Helper-Windows-Installer
          path: dist/*.exe
